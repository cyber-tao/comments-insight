name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Submit uploaded package for Chrome Web Store review (false = draft upload only)'
        type: boolean
        default: false
      publish_type:
        description: 'Chrome Web Store publish type'
        type: choice
        default: DEFAULT_PUBLISH
        options:
          - DEFAULT_PUBLISH
          - STAGED_PUBLISH
      deploy_percentage:
        description: 'Optional initial rollout percentage (1-100)'
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      HAS_CWS_TARGETS: ${{ secrets.CHROME_PUBLISHER_ID != '' && secrets.CHROME_EXTENSION_ID != '' }}
      HAS_CWS_OIDC: ${{ secrets.CHROME_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.CHROME_SERVICE_ACCOUNT != '' }}
      HAS_CWS_SA_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY != '' }}
      HAS_CWS_OAUTH: ${{ secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, Type check and Lint
        run: |
          bun run version:check
          bun run format:check
          bun run typecheck
          bun run lint

      - name: Test with coverage thresholds
        run: bun run test:coverage

      - name: Security audit
        run: bun run audit

      - name: Build
        run: bun run build

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('bun.lock') }}

      - name: Install Chrome for Testing
        run: bunx puppeteer browsers install chrome

      - name: Browser E2E
        run: xvfb-run -a bun run test:e2e

      - name: Generate CRX
        if: startsWith(github.ref, 'refs/tags/v')
        run: node node_modules/crx3/bin/crx3.js dist -o "comments-insight-${{ github.ref_name }}.crx"

      - name: Package ZIP
        run: bun scripts/package.js

      - name: Build Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: 'HYBRID'
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "pr_template": "- #{{TITLE}} by @#{{AUTHOR}} in ##{{NUMBER}}",
              "commit_template": "- #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## ♻️ Refactoring",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## 📦 Dependencies",
                  "labels": ["deps", "dependency", "dependencies"]
                },
                {
                  "title": "## 🛠️ Maintenance",
                  "labels": ["chore", "ci", "build", "style", "perf", "test", "revert"]
                },
                {
                  "title": "## 📋 Other",
                  "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]*\\))?(!)?: .+",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: |
            dist/extension.zip
            comments-insight-${{ github.ref_name }}.crx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (CWS OIDC)
        id: cws_oidc
        if: env.HAS_CWS_TARGETS == 'true' && env.HAS_CWS_OIDC == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload to Chrome Web Store (API v2)
        if: env.HAS_CWS_TARGETS == 'true' && (env.HAS_CWS_OIDC == 'true' || env.HAS_CWS_SA_KEY == 'true' || env.HAS_CWS_OAUTH == 'true')
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_ACCESS_TOKEN: ${{ steps.cws_oidc.outputs.access_token }}
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true }}
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type }}
          CWS_DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
        run: |
          node scripts/publish-cws.mjs --file dist/extension.zip | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Warn when Chrome Web Store secrets are missing
        if: env.HAS_CWS_TARGETS != 'true' || (env.HAS_CWS_OIDC != 'true' && env.HAS_CWS_SA_KEY != 'true' && env.HAS_CWS_OAUTH != 'true')
        run: |
          echo "::warning::Chrome Web Store upload skipped: missing required repository secrets."
          {
            echo "## Chrome Web Store Upload Skipped"
            echo ""
            echo "Configure \`CHROME_PUBLISHER_ID\` and \`CHROME_EXTENSION_ID\`, plus one authentication method:"
            echo "- Recommended: Google Cloud OIDC (\`CHROME_WORKLOAD_IDENTITY_PROVIDER\` + \`CHROME_SERVICE_ACCOUNT\`)"
            echo "- Service Account JSON key: \`CHROME_SERVICE_ACCOUNT_KEY\`"
            echo "- OAuth2 fallback: \`CHROME_CLIENT_ID\` + \`CHROME_CLIENT_SECRET\` + \`CHROME_REFRESH_TOKEN\`"
          } >> "$GITHUB_STEP_SUMMARY"
